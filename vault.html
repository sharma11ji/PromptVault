<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#FFFFFF;--black:#000000;
  --gray-50:#F5F5F7;--gray-100:#EBEBED;--gray-200:#D6D6DA;
  --gray-400:#8E8E93;--gray-600:#48484A;--gray-800:#1C1C1E;
  --radius-sm:6px;--radius-md:12px;--radius-lg:18px;--radius-xl:24px;
  --shadow-hover:0 4px 12px rgba(0,0,0,.10),0 16px 48px rgba(0,0,0,.12);
  --shadow-modal:0 24px 80px rgba(0,0,0,.22),0 4px 20px rgba(0,0,0,.12);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --trans:cubic-bezier(.25,.46,.45,.94);
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.6;color:var(--black);background:var(--white);
  -webkit-font-smoothing:antialiased;scroll-behavior:smooth;
}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.02em;line-height:1.15}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font:inherit}

/* ── Header ── */
.header{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.9);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.header.scrolled{border-bottom-color:var(--gray-100);box-shadow:0 1px 0 var(--gray-100),0 4px 20px rgba(0,0,0,.04)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 32px;height:60px;
  display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;
  letter-spacing:-.03em;flex-shrink:0}
.logo-mark{font-size:20px}
.nav-center{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.nav-link{padding:6px 12px;border-radius:var(--radius-sm);font-size:14px;font-weight:450;
  color:var(--gray-600);transition:color .18s,background .18s}
.nav-link:hover{color:var(--black);background:var(--gray-50)}
.btn-auth{height:34px;padding:0 16px;border-radius:100px;font-size:13.5px;font-weight:500;
  background:var(--black);color:var(--white);
  transition:background .2s,transform .15s var(--spring),box-shadow .2s}
.btn-auth:hover{background:var(--gray-800);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn-auth.signed-in{background:var(--gray-50);color:var(--black);border:1px solid var(--gray-200);display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;height:38px;max-width:240px}
.header-account{position:relative;margin-left:auto;min-width:0}
.profile-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0}
.profile-initial{display:grid;place-items:center;background:var(--gray-200);font-size:13px;font-weight:600}
.profile-avatar[hidden],.profile-initial[hidden]{display:none!important}
#authBtnText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-menu{position:absolute;right:0;top:46px;min-width:150px;background:var(--white);padding:6px;border:1px solid var(--gray-200);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.profile-menu button{padding:10px 14px;text-align:left;width:100%;border-radius:8px;font-size:13px}
.profile-menu button:hover{background:var(--gray-50)}
@media(max-width:480px){.header-inner{gap:12px}.btn-auth.signed-in{max-width:170px}}

/* ── Hero ── */
.hero{padding:96px 32px 68px}
.hero-inner{max-width:760px;margin:0 auto;text-align:center;animation:fadeUp .7s var(--ease-out) both}
.hero-badge{display:inline-block;padding:4px 12px;border-radius:100px;
  border:1px solid var(--gray-200);font-size:11px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--gray-600);margin-bottom:28px}
.hero-title{font-size:clamp(42px,7vw,72px);font-weight:600;letter-spacing:-.04em;
  line-height:1.06;margin-bottom:22px}
.hero-title em{font-style:italic;font-weight:300}
.hero-sub{font-size:17px;font-weight:300;color:var(--gray-600);line-height:1.6;margin-bottom:44px}

/* ── Search ── */
.search-wrap{position:relative;max-width:560px;margin:0 auto 32px}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);
  color:var(--gray-400);pointer-events:none}
.search-input{width:100%;height:52px;padding:0 56px 0 44px;border-radius:var(--radius-xl);
  border:1.5px solid var(--gray-200);background:var(--gray-50);
  font-family:inherit;font-size:15px;color:var(--black);outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s}
.search-input::placeholder{color:var(--gray-400)}
.search-input:focus{background:var(--white);border-color:var(--gray-400);
  box-shadow:0 0 0 4px rgba(0,0,0,.05)}
.search-kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-family:"DM Mono",monospace;font-size:11px;color:var(--gray-400);
  background:var(--white);border:1px solid var(--gray-200);
  border-radius:4px;padding:2px 6px;pointer-events:none}

/* ── Pills ── */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{height:32px;padding:0 14px;border-radius:100px;border:1.5px solid var(--gray-200);
  background:transparent;font-size:13px;font-weight:450;color:var(--gray-600);
  transition:all .18s var(--trans)}
.pill:hover{border-color:var(--gray-400);color:var(--black)}
.pill.active{background:var(--black);border-color:var(--black);color:var(--white)}

/* ── Section ── */
.section{padding:72px 32px}
.section-alt{background:var(--gray-50);border-top:1px solid var(--gray-100);border-bottom:1px solid var(--gray-100)}
.section-inner{max-width:1200px;margin:0 auto}
.section-header{display:flex;align-items:baseline;gap:12px;margin-bottom:36px}
.section-title{font-size:28px;font-weight:600;letter-spacing:-.03em}
.section-count{font-family:"DM Mono",monospace;font-size:12px;color:var(--gray-400)}

/* ═══════════════════════════════════════
   PROMPT CARD — with media preview
   ═══════════════════════════════════════ */
.prompt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

.prompt-card{background:var(--white);border:1.5px solid var(--gray-100);
  border-radius:var(--radius-xl);overflow:hidden;cursor:pointer;
  transition:transform .24s var(--spring),box-shadow .24s var(--trans),border-color .2s;
  display:flex;flex-direction:column;
  animation:fadeUp .5s var(--ease-out) both;outline:none}
.prompt-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--gray-200)}
.prompt-card:focus-visible{box-shadow:0 0 0 3px rgba(0,0,0,.15)}

/* ── Media Preview Area ── */
.card-media{position:relative;width:100%;height:200px;overflow:hidden;background:var(--gray-100);flex-shrink:0}

/* Photo cards: full photo at its natural aspect ratio, never cropped */
.card-media-photo{height:auto}
.card-media-photo img{width:100%;height:auto;object-fit:contain;display:block;
  transition:filter .3s}
.prompt-card:hover .card-media-photo img{transform:none;filter:brightness(.97)}

/* Image cards */
.card-media img{width:100%;height:100%;object-fit:cover;
  transition:transform .5s var(--trans),filter .3s;display:block}
.prompt-card:hover .card-media img{transform:scale(1.04);filter:brightness(.95)}

/* Video cards */
.card-media video{width:100%;height:100%;object-fit:cover;display:block}
.video-overlay{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.25);
  transition:background .25s}
.prompt-card:hover .video-overlay{background:rgba(0,0,0,.1)}
.play-btn{width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
  transition:transform .2s var(--spring),box-shadow .2s}
.prompt-card:hover .play-btn{transform:scale(1.1);box-shadow:0 6px 28px rgba(0,0,0,.3)}
.play-icon{width:0;height:0;border-style:solid;border-width:8px 0 8px 14px;
  border-color:transparent transparent transparent #000;margin-left:3px}

/* Icon cards (Code, Writing, Music, etc.) */
.card-media-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;transition:transform .3s}
.prompt-card:hover .card-media-icon{transform:scale(1.05)}
.media-icon-glyph{font-size:52px;line-height:1;user-select:none}
.media-icon-label{font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;opacity:.5}

/* Category badge on media */
.media-cat-badge{position:absolute;top:12px;left:12px;padding:4px 10px;
  border-radius:100px;font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

/* ── Card Body ── */
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-id{font-family:"DM Mono",monospace;font-size:10px;color:var(--gray-400)}
.card-title{font-size:16.5px;font-weight:600;letter-spacing:-.025em;line-height:1.25}
.card-excerpt{font-size:13px;font-weight:300;color:var(--gray-600);line-height:1.55;flex:1}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:100px;
  background:var(--gray-50);color:var(--gray-600);border:1px solid var(--gray-100)}
.card-arrow{font-size:16px;color:var(--gray-400);transition:transform .18s var(--spring),color .18s}
.prompt-card:hover .card-arrow{transform:translate(3px,-3px);color:var(--black)}

/* ── Category badge colours ── */
.badge-image  {background:rgba(255,255,255,.88);color:#1a1a1a}
.badge-video  {background:rgba(0,0,0,.6);color:#fff}
.badge-webgen {background:rgba(0,102,255,.85);color:#fff}
.badge-code   {background:rgba(0,0,0,.75);color:#00ff88}
.badge-writing{background:rgba(255,255,255,.88);color:#1a1a1a}
.badge-3dart  {background:rgba(0,0,0,.6);color:#f0c060}
.badge-music  {background:rgba(120,0,255,.75);color:#fff}

/* ── Icon card themes ── */
.icon-bg-code   {background:linear-gradient(135deg,#0a0a0a 0%,#1a1a2e 100%)}
.icon-bg-writing{background:linear-gradient(135deg,#f8f6f0 0%,#ede8dc 100%)}
.icon-bg-music  {background:linear-gradient(135deg,#1a0533 0%,#3d0f6b 100%)}

/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;padding:80px 0;
  color:var(--gray-400);gap:12px}
.empty-icon{font-size:40px;font-weight:300}

/* ── Vote buttons (same behavior as the Community page) ── */
.vote-group{display:flex;gap:8px;align-items:center}
.vote-btn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;
  border-radius:100px;background:var(--white);border:1.5px solid var(--gray-200);
  font-family:inherit;font-size:13px;font-weight:500;color:var(--black);cursor:pointer;
  transition:background .18s,border-color .18s,color .18s}
.vote-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vote-btn:hover{border-color:var(--black)}.vote-btn:focus-visible{outline:2px solid var(--black);outline-offset:3px}
.vote-btn[aria-pressed="true"]{background:var(--black);color:var(--white);border-color:var(--black)}
.vote-btn[aria-pressed="true"] svg{fill:currentColor}.vote-btn:disabled{opacity:.6}
.card-author{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;
  color:var(--gray-400);min-width:0;max-width:55%}
.card-author img{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0}
.card-author span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-author-link{cursor:pointer;text-decoration:underline;text-decoration-color:var(--gray-300);text-underline-offset:3px}
.card-author-link:hover,.card-author-link:focus-visible{color:var(--black);text-decoration-color:currentColor}
.card-author-link:focus-visible{outline:2px solid var(--black);outline-offset:3px;border-radius:2px}
@media(max-width:480px){.vote-btn{min-height:40px;padding:0 12px;gap:5px}.vote-group{gap:6px}}

/* ═══════════════════════════════════════
   APP CARDS
   ═══════════════════════════════════════ */
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.app-card{background:var(--white);border:1.5px solid var(--gray-100);
  border-radius:var(--radius-lg);padding:22px;display:flex;flex-direction:column;gap:12px;
  transition:transform .22s var(--spring),box-shadow .22s,border-color .2s;
  animation:fadeUp .5s var(--ease-out) both}
.app-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--gray-200)}
.app-card-top{display:flex;align-items:center;justify-content:space-between}
.app-icon{font-size:24px;line-height:1}
.app-plan{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:100px}
.plan-free{background:#E8F5E9;color:#2E7D32}
.plan-paid{background:#FFF3E0;color:#E65100}
.plan-freemium{background:#EDE7F6;color:#4527A0}
.app-name{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-bottom:5px}
.app-tagline{font-size:13px;font-weight:300;color:var(--gray-600);line-height:1.5}
.app-footer{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.app-cat-tag{font-size:11px;font-weight:500;color:var(--gray-400)}
.app-arrow{font-size:15px;color:var(--gray-400);transition:transform .18s var(--spring),color .18s}
.app-card:hover .app-arrow{transform:translate(2px,-2px);color:var(--black)}

/* ── Footer ── */
.footer{padding:40px 32px;border-top:1px solid var(--gray-100)}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:16px}
.footer-left{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--gray-400)}
.footer-brand{font-weight:600;color:var(--black)}
.footer-right{display:flex;gap:20px}
.footer-link{font-size:13.5px;color:var(--gray-400);transition:color .18s}
.footer-link:hover{color:var(--black)}

/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1);opacity:1}
.modal-box{background:var(--white);border-radius:var(--radius-xl);width:100%;max-width:580px;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-modal);
  transform:translateY(20px) scale(.97);opacity:0;
  transition:transform .35s var(--spring),opacity .25s;display:flex;flex-direction:column}

/* Modal with media header */
.modal-media{width:100%;height:240px;overflow:hidden;border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  position:relative;flex-shrink:0;background:var(--gray-100)}
.modal-media img{width:100%;height:100%;object-fit:cover;display:block}
.modal-media video{width:100%;height:100%;object-fit:cover;display:block}
.modal-media-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px}
.modal-media-glyph{font-size:64px;line-height:1}
.modal-media-cat{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.5}

.modal-top{display:flex;align-items:flex-start;justify-content:space-between;
  padding:24px 28px 0;gap:16px}
.modal-cat-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--gray-400);display:block;margin-bottom:6px}
.modal-title{font-size:22px;font-weight:600;letter-spacing:-.03em}
.modal-close{flex-shrink:0;width:32px;height:32px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:var(--gray-50);color:var(--gray-600);
  transition:background .18s,color .18s}
.modal-close:hover{background:var(--gray-100);color:var(--black)}
.modal-body{padding:16px 28px 0}
.modal-prompt-text{font-size:13.5px;line-height:1.8;color:var(--gray-800);
  font-family:"DM Mono",monospace;background:var(--gray-50);border:1px solid var(--gray-100);
  border-radius:var(--radius-md);padding:20px;white-space:pre-wrap;word-break:break-word}
.modal-footer{display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px 24px;border-top:1px solid var(--gray-100);margin-top:16px}
.modal-id{font-family:"DM Mono",monospace;font-size:11px;color:var(--gray-400)}
.btn-copy{display:flex;align-items:center;gap:7px;height:36px;padding:0 16px;
  border-radius:100px;background:var(--gray-50);border:1.5px solid var(--gray-200);
  font-size:13px;font-weight:500;color:var(--black);transition:all .18s}
.btn-copy:hover{background:var(--black);color:var(--white);border-color:var(--black)}

/* Auth Modal */
.modal-auth{max-width:420px}
.auth-tabs{display:flex;padding:16px 28px 0;gap:2px;border-bottom:1px solid var(--gray-100)}
.auth-tab{flex:1;padding:10px;font-size:13.5px;font-weight:500;color:var(--gray-400);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .18s,border-color .18s}
.auth-tab.active{color:var(--black);border-bottom-color:var(--black)}
.auth-form{padding:24px 28px 28px;display:flex;flex-direction:column;gap:14px}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:12.5px;font-weight:500;color:var(--gray-600)}
.field-input{height:44px;padding:0 14px;border-radius:var(--radius-md);
  border:1.5px solid var(--gray-200);background:var(--gray-50);
  font-family:inherit;font-size:14.5px;color:var(--black);outline:none;
  transition:border-color .2s,background .2s,box-shadow .2s}
.field-input:focus{background:var(--white);border-color:var(--black);box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.auth-error{font-size:12.5px;color:#C62828;min-height:18px}
.btn-auth-submit{height:46px;border-radius:var(--radius-md);background:var(--black);
  color:var(--white);font-size:14.5px;font-weight:500;
  transition:background .2s,transform .15s var(--spring)}
.btn-auth-submit:hover{background:var(--gray-800);transform:translateY(-1px)}
.btn-auth-submit:disabled{opacity:.5;transform:none;cursor:default}
.auth-divider{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--gray-400)}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--gray-100)}
.btn-google{height:46px;border-radius:var(--radius-md);border:1.5px solid var(--gray-200);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:14px;font-weight:500;background:var(--white);
  transition:background .18s,border-color .18s,transform .15s var(--spring)}
.btn-google:hover{background:var(--gray-50);border-color:var(--gray-400);transform:translateY(-1px)}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--black);color:var(--white);font-size:13.5px;font-weight:450;
  padding:11px 20px;border-radius:100px;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .3s var(--spring);z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.toast-error{background:#C62828}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400)}

@media(max-width:768px){
  .header-inner{padding:0 20px}.nav-center{display:none}
  .hero{padding:72px 20px 56px}.hero-sub br{display:none}
  .section{padding:52px 20px}
  .prompt-grid{grid-template-columns:1fr}
  .apps-grid{grid-template-columns:1fr}
  .footer-inner{flex-direction:column;text-align:center}
  .footer-right{justify-content:center}
}
@media(max-width:480px){.pill{font-size:12px;height:28px;padding:0 11px}.search-kbd{display:none}}
::selection{background:rgba(0,0,0,.08)}
